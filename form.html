<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review</title>
  <meta name="description" content="A product review form where users rate and review a product.">
  <meta name="author" content="Paulo Aguilar">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form action="review.html" method="get">

      <div>
        <label for="product-name">Product Name</label>
        <select id="product-name" name="product-name" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <div>
        <p class="group-title">Overall Rating</p>
        <div class="rating">
          <div>
            <label for="rating-1">&star;</label>
            <input type="radio" id="rating-1" name="rating" value="1" required>
          </div>
          <div>
            <label for="rating-2">&star;&star;</label>
            <input type="radio" id="rating-2" name="rating" value="2" required>
          </div>
          <div>
            <label for="rating-3">&star;&star;&star;</label>
            <input type="radio" id="rating-3" name="rating" value="3" required>
          </div>
          <div>
            <label for="rating-4">&star;&star;&star;&star;</label>
            <input type="radio" id="rating-4" name="rating" value="4" required>
          </div>
          <div>
            <label for="rating-5">&star;&star;&star;&star;&star;</label>
            <input type="radio" id="rating-5" name="rating" value="5" required>
          </div>
        </div>
      </div>

      <div>
        <label for="install-date">Date of Installation</label>
        <input type="date" id="install-date" name="install-date" required>
      </div>

      <div>
        <p class="group-title">Which features did you find useful in the product? <em>(Check all that apply)</em></p>
        <div class="feature">
          <input type="checkbox" id="durability" name="features" value="durability">
          <label for="durability">Durability</label>
        </div>
        <div class="feature">
          <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
          <label for="ease-of-use">Ease of Use</label>
        </div>
        <div class="feature">
          <input type="checkbox" id="performance" name="features" value="performance">
          <label for="performance">Performance</label>
        </div>
        <div class="feature">
          <input type="checkbox" id="design" name="features" value="design">
          <label for="design">Design</label>
        </div>
      </div>

      <div>
        <label for="written-review">Written Review (Optional)</label>
        <textarea id="written-review" name="written-review" rows="6"></textarea>
      </div>

      <div>
        <label for="user-name">Your Name (Optional)</label>
        <input type="text" id="user-name" name="user-name">
      </div>

      <input type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Paulo Aguilar - Perú</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
